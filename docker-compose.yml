services:
  backend:
    build: .
    ports:
      - "8000:8000"

    depends_on: 
      - postgres
    
    env_file:
      - .env
    
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # cache:
  #   image: ...
  

volumes:
  postgres_data:
