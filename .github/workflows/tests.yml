name: CI

on:
  push:
    branches:
      - main
  
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shop_api_test
        ports:
        - 5432:5432

        options: >-
          --health-cmd="pg_isready -U test -d shop_api_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
        
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/shop_api_test

          DB_USER: test
          DB_PASS: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: shop_api_test

          SECRET_KEY: test-secret-SECRET_KEY
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60

          CACHE_TTL_SECONDS: 3600
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        
        run: pytest